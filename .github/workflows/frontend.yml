name: frontend

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact-name: ${{ steps.bundle.outputs.artifact-name }}
    env:
      CYPRESS_INSTALL_BINARY: '0'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run frontend:test
      - run: npm run test:frontend -- --run
      - run: npm run build
      - name: Package the exact checkout
        id: bundle
        run: |
          npm run frontend:bundle
          echo "artifact-name=frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Run mobile layout in real Chromium
        shell: bash
        env:
          MOBILE_SMOKE_OUTPUT: ${{ runner.temp }}/mobile-browser-smoke
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$chrome_bin"
          cp dist/frontend-manifest.json build/frontend-manifest.json
          node scripts/fixtures/mobile-layout-api-server.mjs build \
            > "$RUNNER_TEMP/mobile-layout-api.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8765/__fixture_provenance \
              > "$RUNNER_TEMP/mobile-layout-provenance.json"; then
              break
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/mobile-layout-provenance.json"
          CHROME_BIN="$chrome_bin" npm run test:mobile:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-browser-smoke-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-browser-smoke/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: ${{ steps.bundle.outputs.artifact-name }}
          path: dist/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Record build provenance
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const m = JSON.parse(fs.readFileSync('dist/frontend-manifest.json', 'utf8'));
            if (m.sourceCommit !== process.env.GITHUB_SHA) throw new Error('Source SHA mismatch');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              'Official UI: ' + m.upstreamVersion + '\n\nSource: \`' + m.sourceCommit +
              '\`\n\nAssets: ' + m.files.length + '; frontend routes: ' + m.pageRoutes.length +
              '\n\nFrontend checks passed. After a main release, consumers synchronize this exact frontend before building images and APKs.\n');
          "

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.checks.outputs.artifact-name }}
          path: dist
      - name: Publish immutable frontend bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="frontend-${GITHUB_SHA:0:12}"
          cd dist
          sha256sum --check SHA256SUMS
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_assets="$(mktemp -d)"
            gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --dir "$existing_assets" \
              --pattern SHA256SUMS \
              --pattern open-webui-frontend.zip \
              --pattern frontend-manifest.json
            (cd "$existing_assets" && sha256sum --check SHA256SUMS)
            cmp SHA256SUMS "$existing_assets/SHA256SUMS"
            echo "The matching public release already exists; no assets were replaced."
            exit 0
          fi
          cat > RELEASE_NOTES.md <<EOF
          Complete official Open WebUI v0.12.2 frontend baseline.

          Upstream: open-webui/open-webui@6a18585ff4c2e5f6805f682222cfbc46dc669ef8
          Frontend source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}

          The ZIP contains the static frontend and frontend-manifest.json. Android consumers must pin the source commit and ZIP SHA256. Backend and APK pipelines synchronize this verified release before their next build.

          Automated validation: frontend package tests, upstream frontend unit tests and production frontend build. This release does not claim Android device or HyperOS verification.

          Upstream branding and license notices are retained. See LICENSE and LICENSE_HISTORY in the source repository.
          EOF
          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Open WebUI frontend ${GITHUB_SHA:0:12}" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            open-webui-frontend.zip frontend-manifest.json SHA256SUMS
